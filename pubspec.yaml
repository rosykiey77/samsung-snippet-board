name: snippetboard
description: "One UI Quick Snippet & Clipboard (Edge Panel) — offline snippet board untuk Galaxy."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  drift: ^2.35.3
  drift_sqflite: ^2.0.1
  dynamic_color: ^2.1.0
  intl: ^0.20.2
  path: ^1.9.1
  sqflite: ^2.4.5
  material_ui: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.15.1
  drift_dev: ^2.35.2
  sqlite3: ^3.5.2 # NativeDatabase.memory() di test host

flutter:
  uses-material-design: true
  generate: true
